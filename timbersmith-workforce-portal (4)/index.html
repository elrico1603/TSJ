<!doctype html>
<html lang="en" style="background-color: #111111; color: white;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TS Hub</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TS Hub" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <style>
      html, body {
        background-color: #111111 !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        color: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      @keyframes pulseDot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body style="background-color: #111111;">
    <div id="root">
      <div style="position: fixed; inset: 0; background-color: #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">
        <div style="width: 112px; height: 112px; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.1);">
          <img src="/icons/icon-192x192.png" alt="TS Hub Icon" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <div style="font-size: 20px; font-weight: 900; letter-spacing: 0.2em; color: #ffffff; text-transform: uppercase; margin-bottom: 8px;">
          TIMBERSMITH JOINERY
        </div>
        <div style="font-size: 13px; font-weight: 500; color: #10b981; letter-spacing: 0.05em; margin-bottom: 32px;">
          System Initialising...
        </div>
        <div style="display: flex; gap: 10px; align-items: center; justify-content: center; position: absolute; bottom: calc(48px + env(safe-area-inset-bottom, 0px));">
          <div style="width: 12px; height: 12px; border-radius: 50%; background-color: #22c55e; animation: pulseDot 1.4s infinite ease-in-out both;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background-color: #22c55e; animation: pulseDot 1.4s infinite ease-in-out both; animation-delay: 0.2s;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background-color: #22c55e; animation: pulseDot 1.4s infinite ease-in-out both; animation-delay: 0.4s;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
