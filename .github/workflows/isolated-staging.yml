name: Isolated TS Hub staging package
on:
  push:
    branches: [staging/managed-user-pc-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx --no-install tsx scripts/test-clocking-mutation-guard.ts
      - run: npx --no-install tsx scripts/test-clocking-branch-manifest.ts
      - name: Assert missing staging configuration is rejected
        run: |
          if node scripts/check-staging-environment.mjs; then
            echo "::error::Staging safety gate accepted empty configuration."
            exit 1
          fi
      - name: Assert live Firebase configuration is rejected
        run: |
          if VITE_FIREBASE_API_KEY=invalid VITE_FIREBASE_AUTH_DOMAIN=timbersmithapp.firebaseapp.com VITE_FIREBASE_PROJECT_ID=timbersmithapp VITE_FIREBASE_APP_ID=invalid VITE_FIREBASE_MESSAGING_SENDER_ID=invalid VITE_FIREBASE_STORAGE_BUCKET=timbersmithapp.firebasestorage.app VITE_TSJ_MANAGED_USER_API_BASE_URL=https://timbersmith-terminal.netlify.app VITE_TSJ_MANAGED_USER_UI=true node scripts/check-staging-environment.mjs; then
            echo "::error::Staging safety gate accepted production Firebase."
            exit 1
          fi
  stage:
    if: ${{ vars.TSJ_STAGING_MANAGED_API_URL != '' }}
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/managed-user-pc-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Confirm staging rejects missing configuration
        run: |
          if node scripts/check-staging-environment.mjs; then
            echo "::error::Safety gate accepted empty configuration."
            exit 1
          fi
      - name: Refuse production Firebase or API
        run: node scripts/check-staging-environment.mjs
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAuUMb1blX8fwUkHMgu5WYagm37kDMhO5Q
          VITE_FIREBASE_AUTH_DOMAIN: timbersmith-staging.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: timbersmith-staging
          VITE_FIREBASE_APP_ID: 1:351455828495:web:0fd1d0a7846feb7a92a17a
          VITE_FIREBASE_MESSAGING_SENDER_ID: 351455828495
          VITE_FIREBASE_STORAGE_BUCKET: timbersmith-staging.firebasestorage.app
          VITE_TSJ_MANAGED_USER_API_BASE_URL: ${{ vars.TSJ_STAGING_MANAGED_API_URL }}
          VITE_TSJ_MANAGED_USER_UI: 'true'
      - name: Build isolated staging PWA
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAuUMb1blX8fwUkHMgu5WYagm37kDMhO5Q
          VITE_FIREBASE_AUTH_DOMAIN: timbersmith-staging.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: timbersmith-staging
          VITE_FIREBASE_APP_ID: 1:351455828495:web:0fd1d0a7846feb7a92a17a
          VITE_FIREBASE_MESSAGING_SENDER_ID: 351455828495
          VITE_FIREBASE_STORAGE_BUCKET: timbersmith-staging.firebasestorage.app
          VITE_TSJ_MANAGED_USER_API_BASE_URL: ${{ vars.TSJ_STAGING_MANAGED_API_URL }}
          VITE_TSJ_MANAGED_USER_UI: 'true'
          VITE_FIREBASE_LOGIN_PILOT: 'true'
      - name: Upload test-only site files (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: ts-hub-isolated-staging
          path: dist/
          retention-days: 7
