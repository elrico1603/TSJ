name: Isolated TS Hub staging package
on:
  push:
    branches: [staging/managed-user-pc-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/managed-user-pc-test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Confirm staging rejects missing configuration
        run: |
          if node scripts/check-staging-environment.mjs; then
            echo "::error::Safety gate accepted empty configuration."
            exit 1
          fi
      - name: Refuse production Firebase or API
        run: node scripts/check-staging-environment.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.TSJ_STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.TSJ_STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.TSJ_STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.TSJ_STAGING_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TSJ_STAGING_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.TSJ_STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_TSJ_MANAGED_USER_API_BASE_URL: ${{ vars.TSJ_STAGING_MANAGED_API_URL }}
          VITE_TSJ_MANAGED_USER_UI: 'true'
      - name: Build isolated staging PWA
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.TSJ_STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.TSJ_STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.TSJ_STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.TSJ_STAGING_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TSJ_STAGING_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.TSJ_STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_TSJ_MANAGED_USER_API_BASE_URL: ${{ vars.TSJ_STAGING_MANAGED_API_URL }}
          VITE_TSJ_MANAGED_USER_UI: 'true'
          VITE_FIREBASE_LOGIN_PILOT: 'true'
      - name: Upload test-only site files (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: ts-hub-isolated-staging
          path: dist/
          retention-days: 7
