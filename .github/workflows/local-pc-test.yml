name: Local emulator PC test checks
on:
  push:
    branches: [test/local-pc-firebase-emulators]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run permissions:sync
      - run: npm run lint
      - run: npm run build
      - run: npx --no-install tsx scripts/test-clocking-mutation-guard.ts
